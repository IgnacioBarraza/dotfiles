# ============================================================================
# Module: Unattended answers
# Project: Dotfiles
# ----------------------------------------------------------------------------
# Every question the installer asks, answered ahead of time. Used by
# ./install.sh --unattended, which never stops to ask.
#
# These values also pre-fill an interactive run: pressing Enter at a prompt
# takes the answer from here, so this file is a set of preferences and not only
# an unattended script.
#
# Format:  key = value
#
# Yes or no questions take y or n. Numbered menus take the number. Multi-select
# menus take "all", a comma separated list of numbers, or empty to skip.
# ============================================================================

# ---- Install ----
continue              = y

# ---- Git ----
# Left empty on purpose: a name and an email cannot be guessed, and an
# unattended run skips the Git step rather than committing as somebody else.
git_name              =
git_email             =
git_update_user       = n

# No key is generated unattended. A key made without anyone watching is a key
# nobody remembers adding to GitHub. Run ./install.sh --ssh when you want one.
git_ssh_key           = n
git_ssh_overwrite     = n
git_ssh_use_git_email = y
git_ssh_email         =

# ---- Terminal ----
zsh                   = y
shell_plugins         = y
terminal              = 1     # 1 Kitty, 2 Alacritty, 3 skip
pokemon               = y
fonts                 = y

# ---- Applications ----
browser               = 2     # 1 Brave, 2 Zen, 3 Chrome, 4 keep Firefox, 5 skip
apps                  = all

# ---- Languages ----
languages             = all

# ---- Containers and databases ----
docker                = y
lazydocker            = y
databases             = all

# ---- Desktop ----
desktop               = 1     # 1 Nach0_0, 2 Caelestia, 3 skip
# Caelestia hands over to a full screen installer of its own, which cannot be
# answered from here, so an unattended run does not choose it.
caelestia             = n

# ---- Login screen ----
login_palette         = 1     # 1 Kanagawa, 2 Sakura, 3 Yuki, 4 skip
login_background      = 1     # the palette's own torii

# ---- Panel ----
panel_islands         = y
desktop_widgets       = y
