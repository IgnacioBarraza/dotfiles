# ============================================================================
# Theme: Kanagawa 神奈川
# Project: Dotfiles
# ----------------------------------------------------------------------------
# Paleta wave de rebelot, tonos tierra apagados. Contrapunto calido a Sakura.
# Generated from config/kitty/themes/kanagawa.conf so both terminals stay in sync.
# ============================================================================

[colors.primary]
background = "#1F1F28"
foreground = "#DCD7BA"

[colors.cursor]
text   = "#1F1F28"
cursor = "#C8C093"

[colors.vi_mode_cursor]
text   = "#1F1F28"
cursor = "#C0A36E"

[colors.selection]
text       = "#C8C093"
background = "#2D4F67"

[colors.search.matches]
foreground = "#1F1F28"
background = "#C0A36E"

[colors.search.focused_match]
foreground = "#1F1F28"
background = "#957FB8"

[colors.footer_bar]
foreground = "#1F1F28"
background = "#C0A36E"

[colors.hints.start]
foreground = "#1F1F28"
background = "#C0A36E"

[colors.hints.end]
foreground = "#1F1F28"
background = "#8484A0"

[colors.normal]
black    = "#16161D"
red      = "#CF6769"
green    = "#76946A"
yellow   = "#C0A36E"
blue     = "#7E9CD8"
magenta  = "#957FB8"
cyan     = "#6A9589"
white    = "#C8C093"

[colors.bright]
black    = "#8484A0"
red      = "#EC4F4F"
green    = "#98BB6C"
yellow   = "#E6C384"
blue     = "#7FB4CA"
magenta  = "#B4A0D8"
cyan     = "#7AA89F"
white    = "#DCD7BA"
